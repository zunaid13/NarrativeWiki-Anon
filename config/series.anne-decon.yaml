# "Harriet Ainslie") and used stand-ins that are names in the books (Marilla -> Hester, with Hester Gray
# in v2). Now: every mapped person's bare first name and surname is mapped; no stand-in occurs in
# v1-5; the Island's own place names (Charlottetown, Prince Edward Island, Summerside) are replaced;
# "West" is mapped only in name contexts (the direction stays). Gate: scripts/eval/decon_map_audit.py.
# Superseded rules, kept for the record: fictional people and places only (Charlottetown, Prince Edward
# Island, Canada stay: real places are story facts). A surname that is also an English word (West, Ford,
# Grant, Baker, Moore, Lewis) is mapped only inside full names. "Mary" (several women) and "Glen" (a common
# noun in the text) are left. Anne's maiden name and her son Shirley share one stand-in, as in
# the book. The title is neutral: a series title can reach prompts.
