# Plan 0015 step 4: seeded disclosures for the M4 candidate search (scripts/eval/m4_seed_test.py).
# One entry per later gold fact of docs/eval/parametric/anne.yaml (reveal volumes 2..5), in file order.
#   p = a natural paraphrase that STATES the fact in other words
#   o = an oblique sentence that does not state the fact but from which a reader would conclude it
# {N} is replaced by the character's name or by a pronoun, depending on the variant tested.
#
# VERSION 2 (2026-10-02), after semantic validation. Version 1 (anne_seeds_v1.yaml, results in
# anne_sensitivity_v1.json) was written before the test and reviewed afterwards: many of its oblique
# sentences did not establish their assigned fact (they dropped the fact's object, e.g. an unnamed
# "wealthy suitor" for Roy Gardner, or described a different event, e.g. pneumonia after a graveyard
# penance for Carl's sore throat after the marsh; "a year younger than Faith" for "Una is ten").
# Rule applied to every sentence here, the same rule as M1's "conveyed": the sentence, read by someone
# who knows volumes 1..t, must establish the fact's subject, its event / relation / attribute and its
# object (a named person, place or thing that is the point of the fact must be identifiable); an
# incidental qualifier may be missing. A paraphrase says it; an oblique sentence makes the reader
# infer it. Each sentence was checked against that rule WITHOUT looking at whether the search finds
# it; `v1` marks what was kept unchanged from version 1 (k) or rewritten (r) for the paraphrase and
# the oblique sentence, in that order.
