[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "narrativewiki"
version = "0.1.0"
description = "Spoiler-scoped character wikis generated from a novel series, via a temporal knowledge graph"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    # Ingestion
    "EbookLib>=0.18",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    # Entities / graph
    # pyahocorasick optional: entities/automaton.py falls back to its own hand-rolled naive
    # multi-substring scan when the C ext is absent, not to a second package -- ahocorapy was
    # declared here and checked for by `wiki doctor` without ever being imported by automaton.py
    # itself (docs/PLAN_2026-09-14_pre_full_scale_audit.md Sec3.6 item 2); removed rather than wired,
    # since the naive fallback already works correctly.
    "pyahocorasick>=2.1; platform_python_implementation == 'CPython'",
    "networkx>=3.2",
    "rapidfuzz>=3.6",
    "Unidecode>=1.3",
    # Models
    "httpx>=0.27",             # Ollama + OpenAI-compatible providers
    # Plumbing
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    "tqdm>=4.66",
    "Jinja2>=3.1",
]

[project.optional-dependencies]
# Optional API providers. The pipeline runs fully local without any of these.
anthropic = ["anthropic>=0.40"]
google = ["google-genai>=1.0"]
all = ["anthropic>=0.40", "google-genai>=1.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
nli = ["torch>=2.6", "transformers>=4.45", "sentencepiece>=0.2"]
# Renders the emitted Markdown wiki (site/mkdocs_wiki.py) to browsable HTML. The pipeline never
# imports mkdocs itself -- `wiki site build` always writes the .md tree; --html additionally
# shells `mkdocs build` when this extra is installed. Optional so the pipeline keeps running on
# Python alone (CLAUDE.md §7); the .md tree is the deliverable, the HTML is a rendering of it.
wiki = ["mkdocs>=1.6", "mkdocs-material>=9.5"]

[project.scripts]
wiki = "narrativewiki.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore::bs4.XMLParsedAsHTMLWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
